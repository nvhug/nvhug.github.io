name: Habits Notify

on:
  schedule:
    - cron: '*/5 * * * *'  # every 5 minutes (UTC); endpoint converts to Vietnam time internally
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Call habits-notify endpoint
        run: |
          curl -s -w "\nHTTP_STATUS:%{http_code}\n" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PROD_URL }}/api/habits-notify"
